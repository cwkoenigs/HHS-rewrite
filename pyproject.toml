[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hhs_risk"
version = "0.1.0"
description = "Python port of the HHS-HCC DIY risk adjustment SAS software"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["hhs_risk*"]

[tool.setuptools.package-data]
hhs_risk = ["data/**/*.TXT", "data/**/*.csv"]
